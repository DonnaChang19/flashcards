name: Keep Supabase Alive

on:
  schedule:
    # 每周日 UTC 03:00  ping 一次，防止免费 Supabase 项目 7 天无访问自动暂停
    - cron: '0 3 * * 0'
  workflow_dispatch:  # 也允许手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to keep the free project alive..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://nhceunbblvyoepzdjrny.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_4icajuvqUIziuH9KMjMwGg_XB3nw8lg" \
            --max-time 30)
          echo "Supabase returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ]; then
            echo "Ping failed (network/tls issue)."
            exit 1
          fi
